# Blueprint do Render — Cupom Radar
# Web (Next.js) + worker WhatsApp (Baileys) no MESMO serviço, com disco em /data.
# Custo: 1 serviço Starter (~US$ 7) + Postgres Basic (~US$ 6) ≈ US$ 13/mês.
# Aplique em: Render Dashboard → New → Blueprint → estilodocampo/cupom-radar-clone

databases:
  - name: cupom-radar-db
    databaseName: cupom_radar
    user: cupom_radar
    plan: 0.1c-256mb
    postgresMajorVersion: '16'
    region: oregon

services:
  - type: web
    name: cupom-radar
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: main
    autoDeployTrigger: commit
    # Build: instala devDeps (Prisma CLI) e compila o Next.
    buildCommand: npm ci --include=dev && npm run build
    # O projeto usa db push (sem migrations): mantém o schema sincronizado.
    preDeployCommand: npx prisma db push --skip-generate
    # Sobe o worker (porta 3001 interna) + Next (PORT do Render).
    # Chamamos o Node direto para o SIGTERM chegar ao supervisor sem camada do npm.
    startCommand: node scripts/all.js
    healthCheckPath: /api/health
    disk:
      name: wa-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cupom-radar-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      # URL final. No primeiro teste pode ser https://cupom-radar-xxxx.onrender.com
      - key: NEXTAUTH_URL
        sync: false
      - key: WEB_URL
        sync: false
      # Worker roda no mesmo container: sempre localhost.
      - key: WORKER_URL
        value: http://127.0.0.1:3001
      - key: WORKER_TOKEN
        generateValue: true
      - key: AUTH_DIR
        value: /data/auth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ABACATEPAY_API_KEY
        sync: false
      - key: ABACATEPAY_WEBHOOK_SECRET
        sync: false
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: LOG_LEVEL
        value: info
